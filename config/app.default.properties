# Mini Shop の既定設定（git管理。ここは直接編集しない）
#
# 設定を変えたいときは、このファイルを config/app.properties にコピーして、
# 変更したい項目だけを書き換える。app.properties は git管理外なので、
# パスワードなどを書いても公開されない。
# app.properties に書いた項目だけがこのファイルの値より優先される。

