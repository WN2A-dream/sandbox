# Mini Shop の既定設定（git管理。ここは直接編集しない）
#
# 設定を変えたいときは、このファイルを config/app.properties にコピーして、
# 変更したい項目だけを書き換える。app.properties は git管理外なので、
# パスワードなどを書いても公開されない。
# app.properties に書いた項目だけがこのファイルの値より優先される。

# --- PostgreSQL ---
db.host=localhost
db.port=5432
db.name=shop
db.user=postgres
db.password=postgres

# --- setup-db.bat 用 ---
# psql.exe が自動で見つからないときだけ、app.properties に次の形式で書く（アプリ本体では使わない）
# psql.path=D:\PostgreSQL\18\bin\psql.exe

# --- Webサーバー ---
server.port=8080
